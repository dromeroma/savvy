name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint + tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: savvy
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SAVVY_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/savvy
      SAVVY_JWT_SECRET_KEY: ci-test-secret-not-for-prod
      SAVVY_APP_ENV: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install deps
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Create test DB + extensions
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE savvy_test;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d savvy_test -c "CREATE EXTENSION IF NOT EXISTS unaccent;"
      - name: Lint (ruff)
        working-directory: backend
        run: ruff check src
      - name: Tests (pytest)
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend · typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build (production)
        working-directory: frontend
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

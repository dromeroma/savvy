[project]
name = "savvycore"
version = "0.1.0"
description = "SavvyCore - Multi-tenant SaaS backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0,<5.0.0",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "jinja2>=3.1.0",
    "xhtml2pdf>=0.2.13",
    "sentry-sdk>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Set enfocado en errores que ROMPEN en runtime (no estilo): sintaxis, nombres
# indefinidos, redefiniciones, f-strings mal formados. F401 (import sin usar)
# queda FUERA a propósito: el codebase usa side-effect imports para registrar
# modelos SQLAlchemy, y removerlos rompería el descubrimiento de modelos.
# Para endurecer estilo más adelante: añadir "E", "I", "UP", "B" y limpiar por tandas.
select = ["E9", "F63", "F7", "F82", "F811", "F821", "F823"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
